version: '3.8'

services:
  # The Single Port entry gateway
  gateway:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - backend-service

  # React Client Dev Server
  client:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    # Added --allow-build to approve necessary compilation scripts like esbuild
    command: sh -c "corepack enable pnpm && pnpm install && ./node_modules/.bin/vite --host 0.0.0.0"
    ports:
      - "5173:5173"


  # Spring Boot Java Application
  backend-service:
    image: gradle:8.7-jdk17 # Matches the Gradle build configuration
    working_dir: /app
    volumes:
      - ./backend-service:/app
    # Boots up the local environment directly on port 8081
    command: gradle bootRun --args='--server.port=8081'
    ports:
      - "8081:8081"
