<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="250" y="20" width="200" height="60" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Local Browser</text>
  <text x="350" y="64" text-anchor="middle" font-size="12" fill="#475569">http://localhost:8080</text>

  <!-- Arrow: Browser -> Gateway -->
  <line x1="350" y1="80" x2="350" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="225" y="130" width="250" height="70" rx="8" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="350" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Nginx API Gateway</text>
  <text x="350" y="176" text-anchor="middle" font-size="12" fill="#312e81">Port 8080</text>
  <text x="350" y="192" text-anchor="middle" font-size="11" fill="#4338ca">routes by path prefix</text>

  <!-- Arrows: Gateway -> Client, Gateway -> Backend -->
  <line x1="300" y1="200" x2="160" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="200" x2="540" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="200" y="222" font-size="11" fill="#475569">/*</text>
  <text x="470" y="222" font-size="11" fill="#475569">/api/*</text>

  <!-- Client -->
  <rect x="50" y="250" width="220" height="90" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="160" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">React Client</text>
  <text x="160" y="296" text-anchor="middle" font-size="12" fill="#14532d">Vite dev server</text>
  <text x="160" y="312" text-anchor="middle" font-size="11" fill="#166534">Port 5173</text>
  <text x="160" y="328" text-anchor="middle" font-size="11" fill="#166534">calls /api/subscriptions</text>

  <!-- Backend -->
  <rect x="430" y="250" width="220" height="90" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="540" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">Spring Boot API</text>
  <text x="540" y="296" text-anchor="middle" font-size="12" fill="#7c2d12">Gradle build</text>
  <text x="540" y="312" text-anchor="middle" font-size="11" fill="#9a3412">Port 8081</text>
  <text x="540" y="328" text-anchor="middle" font-size="11" fill="#9a3412">in-memory subscription store</text>

  <!-- Docker boundary -->
  <rect x="20" y="115" width="660" height="245" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="35" y="105" font-size="12" fill="#64748b" font-weight="600">Docker Compose</text>
</svg>
