plugins {
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// This is the modern, error-proof way to lock the Java version in Gradle
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()

    testLogging {
        // ONLY log when a test explicitly fails or is skipped (keeps logs clean)
        events "failed", "skipped"
        
        // Show the code's System.out logs ONLY for tests that end up failing
        showStandardStreams = false
        
        // Print full stack traces and reasons only for errors
        exceptionFormat = "full"
    }

    // This hook executes immediately after the test run finishes
    afterSuite { desc, result ->
        if (!desc.parent) { // Focuses entirely on the final root suite summary
            println "\n=========================================="
            println " TEST EXECUTION SUMMARY"
            println "=========================================="
            println " Total Tests : ${result.testCount}"
            println " Passed      : ${result.successfulTestCount}"
            println " Failed      : ${result.failedTestCount}"
            println " Skipped     : ${result.skippedTestCount}"
            println "==========================================\n"
        }
    }
}
